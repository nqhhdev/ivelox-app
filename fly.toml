# fly.toml app configuration file generated for ivelox-app on 2026-05-19T07:29:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ivelox-app'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'